name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
      # Reproducible end-to-end suite compared with benchmarks/baseline.json: fails on lost
      # correctness, extra turns, token growth, worse discovery, or more optimizer tokenizing.
      - run: npm run benchmark:ci -- --out-dir benchmark-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-suite-node${{ matrix.node }}
          path: benchmark-results/
          if-no-files-found: ignore
